# Occlusion test: cars partly hidden behind a pole, a tree, a hydrant, a skateboarder and horses are
# replaced by other cars (AnyDoor, references from the same split); the occluders must stay in front.
name: coco_car_occluded_replace
domain: scene
source: {annotations: data/coco/annotations/instances_val2017.json, images: data/coco/val2017, split: val2017, download_missing: true}
targets: {classes: [car], min_area: 5000, max_per_image: 1, image_ids: [526392, 17029, 439623, 278705, 507975]}
operation: replace
conditioning:
  type: reference_object
  reference: {match: visual, min_area: 12000, max_uses: 2}
mask: {shape: convex_hull, dilate_px: 16}
generator: {adapter: anydoor, steps: 30}
output: {dir: out/coco_car_occluded_replace}
n_samples: 5
